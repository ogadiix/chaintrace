name: ChainTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Run Ruff Lint
        run: ruff check apps/api
      - name: Run Pytest
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          pytest apps/api/tests

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm install
      - name: Typecheck Types & Shared Packages
        run: |
          npm run typecheck --workspace=@chaintrace/types
          npm run typecheck --workspace=@chaintrace/shared
      - name: Build Web Application
        run: npm run build --workspace=@chaintrace/web
